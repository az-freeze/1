name: AZ Freeze Site Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create site
        run: |
          mkdir -p dist

          cat > dist/index.html << 'EOF'
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AZ Freeze Appliance Repair</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f6f7fb;
      color: #222;
    }

    .hero {
      background: #0d6efd;
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: 40px;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .call { background: #28a745; color: white; }
    .text { background: #ffc107; color: black; }

    .section {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 15px;
      border-radius: 12px;
    }
  </style>
</head>

